<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="QueParche — descubre la gastronomía callejera de Medellín: arepas, buñuelos, chuzos y más."
    />
    <!-- Favicon rescatado de la versión React: isotipo "Q" con el degradado de marca -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23B026FF'/%3E%3Cstop offset='50%25' stop-color='%23FF006E'/%3E%3Cstop offset='100%25' stop-color='%2300F5FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='%230A0A0A' stroke='url(%23g)' stroke-width='6'/%3E%3Ctext x='50' y='68' font-size='52' font-weight='bold' font-family='Arial' text-anchor='middle' fill='url(%23g)'%3EQ%3C/text%3E%3C/svg%3E"
    />
    <title>QueParche — Gastronomía callejera de Medellín</title>
    <link rel="stylesheet" href="tema-medellin-nocturna.css" />
  </head>
  <body>
    <header class="contenedor" style="padding-top: 2rem; text-align: center">
      <!-- Isotipo: globo de diálogo con el degradado de marca -->
      <svg width="56" height="56" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#B026FF" />
            <stop offset="50%" stop-color="#FF006E" />
            <stop offset="100%" stop-color="#00F5FF" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="#161616" stroke="url(#logo-grad)" stroke-width="4" />
        <path
          d="M50 24c-14.4 0-26 10.4-26 24 0 7.8 3.9 14.7 10 19.1V78l9.3-6.4c2.1.5 4.4.8 6.7.8 14.4 0 26-10.4 26-24S64.4 24 50 24Z"
          fill="url(#logo-grad)"
        />
        <circle cx="39" cy="48" r="4" fill="#0A0A0A" />
        <circle cx="50" cy="48" r="4" fill="#0A0A0A" />
        <circle cx="61" cy="48" r="4" fill="#0A0A0A" />
      </svg>

      <h1 style="font-size: 2.5rem; font-weight: 900">
        Que<span class="texto-degradado">Parche</span>
      </h1>
      <p style="color: var(--texto-suave)">
        Visibilizando la gastronomía callejera de Medellín
      </p>
    </header>

    <main class="contenedor" style="padding-top: 2rem; padding-bottom: 3rem">
      <!-- Muestra de los componentes disponibles en el tema -->
      <div class="rejilla">
        <article class="carta">
          <span class="insignia insignia--violeta">Hoy · 5:00 p. m.</span>
          <h3 style="margin-top: 0.75rem">Nombre del parche</h3>
          <p style="color: var(--texto-suave); font-size: 0.9rem">
            Descripción del servicio de comida callejera.
          </p>
        </article>

        <article class="carta">
          <span class="insignia insignia--cian">Arepas de chócolo</span>
          <h3 style="margin-top: 0.75rem">Otro parche</h3>
          <p style="color: var(--texto-suave); font-size: 0.9rem">
            Las tarjetas usan la clase <code class="texto-acento">.carta</code>.
          </p>
        </article>
      </div>

      <div class="carta" style="margin-top: 1.5rem">
        <label class="etiqueta" for="demo">Campo de formulario</label>
        <input class="campo" id="demo" type="text" placeholder="Ej: Arepas de chócolo" />
        <div style="margin-top: 1rem; display: flex; gap: 0.75rem">
          <button class="boton">Botón primario</button>
          <button class="boton boton--cian">Botón cian</button>
        </div>
      </div>
    </main>

    <footer>
      <div class="contenedor" style="padding-bottom: 1.5rem; color: var(--texto-suave); font-size: 0.85rem">
        © 2026 QueParche — Visibilizando la gastronomía callejera de Medellín.
      </div>
      <div class="barra-degradado"></div>
    </footer>
  </body>
</html>
