spring:
  application:
    name: queparche-core

  # ── Base de datos: MySQL ─────────────────────────────────────────
  # Requiere que el esquema exista antes de arrancar:
  #   CREATE DATABASE queparche CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
  #
  # Las credenciales admiten variables de entorno para no quemarlas
  # en el repositorio; los valores por defecto son los de un MySQL
  # local estándar.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/queparche?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # update: Hibernate crea y actualiza las tablas desde las @Entity.
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    # El dialecto no se declara a propósito: Hibernate lo detecta desde
    # la conexión. Fijarlo a mano solo produce un WARN de deprecación.

server:
  port: 8080
